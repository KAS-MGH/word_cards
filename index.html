<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Карточки слов</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <h1>Карточки слов</h1>
    <p id="deck-name" class="deck-name"></p>

    <nav class="tabs">
      <button type="button" id="tab-train" class="tab active">Тренировка</button>
      <button type="button" id="tab-deck" class="tab">Колода</button>
    </nav>

    <p id="tts-msg" class="error" role="status" hidden></p>

    <section id="view-train">
      <button type="button" id="btn-dir" class="btn btn-light dir">Слово → перевод</button>
      <div id="tag-bar-train" class="tag-bar" hidden></div>
      <p id="repeat-label" class="repeat-label" hidden>Повтор сложных</p>
      <p id="train-empty" class="hint" hidden>Добавьте первую карточку</p>
      <div id="train-done" hidden>
        <p class="hint">На сегодня всё повторено</p>
        <button type="button" id="btn-practice" class="btn">Тренировать всё равно</button>
      </div>
      <div id="train-summary" class="summary" hidden>
        <h2>Итог сессии</h2>
        <ul class="sum-list">
          <li>Карточек: <b id="sum-total"></b></li>
          <li>Сразу запомнили: <b id="sum-first"></b></li>
          <li>Пришлось повторять: <b id="sum-hardcount"></b></li>
          <li>Ответов всего: <b id="sum-answers"></b></li>
        </ul>
        <div id="sum-hard-box" hidden>
          <h3>Сложные слова</h3>
          <ul id="sum-hard" class="hard-list"></ul>
        </div>
        <div class="row">
          <button type="button" id="btn-repeat" class="btn btn-light" hidden>Повторить сложные</button>
          <button type="button" id="btn-new" class="btn">Новая сессия</button>
        </div>
      </div>
      <div id="train-box" hidden>
        <button type="button" id="card" class="card" aria-live="polite">
          <span id="card-label" class="card-label"></span>
          <span id="card-text" class="card-text"></span>
          <span id="card-meta" class="card-meta" hidden>
            <span id="card-tr" class="card-tr"></span>
            <span id="card-pos" class="chip"></span>
            <span id="card-level" class="chip"></span>
          </span>
          <span id="card-ex-box" class="card-ex-box" hidden>
            <span class="card-label">Пример</span>
            <span id="card-ex" class="card-ex"></span>
          </span>
          <span id="card-note-box" class="card-ex-box" hidden>
            <span class="card-label">Заметка</span>
            <span id="card-note" class="card-ex card-note-text"></span>
          </span>
        </button>
        <button type="button" id="btn-speak" class="btn btn-light speak" hidden>🔊 Слушать</button>
        <button type="button" id="btn-show" class="btn">Показать</button>
        <div id="answer-btns" class="row" hidden>
          <button type="button" id="btn-unknown" class="btn btn-no">Не знаю</button>
          <button type="button" id="btn-known" class="btn btn-yes">Знаю</button>
        </div>
      </div>
    </section>

    <section id="view-deck" hidden>
      <form id="add-form" class="form" autocomplete="off">
        <div class="frow top">
          <input id="in-word" class="f-word" type="text" placeholder="Слово" aria-label="Слово">
          <select id="in-lang" aria-label="Язык слова"></select>
          <div class="f-tr">
            <input id="in-tr" type="text" placeholder="Транскрипция" aria-label="Транскрипция">
            <div id="in-sugg" class="sugg" hidden></div>
          </div>
          <select id="in-pos" aria-label="Часть речи"></select>
        </div>
        <div class="frow mid">
          <input id="in-trans" type="text" placeholder="Перевод" aria-label="Перевод">
          <div class="fcol">
            <input id="in-example" type="text" placeholder="Пример (необязательно)" aria-label="Пример">
            <textarea id="in-note" rows="2" placeholder="Моя заметка (необязательно)" aria-label="Моя заметка"></textarea>
          </div>
        </div>
        <input id="in-tags" type="text" placeholder="Тематики через запятую (необязательно)" aria-label="Теги">
        <button type="submit" class="btn">Добавить</button>
        <p id="form-error" class="error" hidden></p>
        <p id="form-note" class="form-note" hidden></p>
      </form>

      <div class="search-row">
        <input id="search" type="search" placeholder="Поиск" aria-label="Поиск" autocomplete="off">
        <button type="button" id="btn-reset" class="btn btn-light">Сбросить</button>
      </div>

      <div id="tag-bar-deck" class="tag-bar" hidden></div>

      <p id="deck-empty" class="hint" hidden>Добавьте первую карточку</p>
      <p id="search-empty" class="hint" hidden>Ничего не найдено</p>
      <ul id="list" class="list"></ul>
    </section>
  </main>
  <script src="dict.js"></script>
  <script src="script.js"></script>
</body>
</html>
